    <rect x="30" y="696" width="370" height="116" rx="22" fill="url(#panel)" stroke="#94A3B8" stroke-opacity="0.18"/>
    <text x="50" y="729" font-size="15" font-weight="850" fill="#F8FAFC">Actions</text>
    <rect x="50" y="748" width="98" height="44" rx="14" fill="#111827" stroke="#475569"/>
