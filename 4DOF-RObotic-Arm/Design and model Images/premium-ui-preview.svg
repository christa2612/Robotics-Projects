<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="0.45" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1E293B" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.45" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22D3EE" flood-opacity="0.55"/>
    </filter>
    <filter id="violetGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="430" height="932" fill="url(#bg)"/>
  <circle cx="72" cy="64" r="170" fill="#22D3EE" opacity="0.10"/>
  <circle cx="388" cy="160" r="190" fill="#8B5CF6" opacity="0.10"/>
  <circle cx="344" cy="850" r="170" fill="#38BDF8" opacity="0.07"/>

  <rect x="14" y="14" width="402" height="904" rx="28" fill="#0B1020" opacity="0.78" stroke="#334155" stroke-opacity="0.36"/>

  <g font-family="Inter, SF Pro Display, Arial, sans-serif">
    <text x="30" y="48" font-size="11" font-weight="800" letter-spacing="2.2" fill="#67E8F9">ROBOT ARM PRO</text>
    <text x="30" y="83" font-size="34" font-weight="800" fill="#F8FAFC">Arm Control</text>
    <text x="30" y="108" font-size="13" font-weight="500" fill="#94A3B8">Nano32 autonomous robotics console</text>

    <rect x="282" y="34" width="88" height="38" rx="19" fill="#0B2A24" stroke="#22C55E" stroke-opacity="0.55" filter="url(#cyanGlow)"/>
    <circle cx="304" cy="53" r="5" fill="#22C55E"/>
    <text x="323" y="58" font-size="13" font-weight="800" fill="#BBF7D0">READY</text>
    <text x="282" y="93" font-size="11" fill="#94A3B8">PCA9685 0x40</text>
    <text x="282" y="110" font-size="11" fill="#64748B">192.168.4.1</text>

    <rect x="30" y="136" width="370" height="82" rx="20" fill="url(#panel)" stroke="#94A3B8" stroke-opacity="0.18" filter="url(#shadow)"/>
