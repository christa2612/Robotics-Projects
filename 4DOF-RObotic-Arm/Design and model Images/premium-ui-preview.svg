    <rect x="158" y="748" width="126" height="44" rx="14" fill="#111827" stroke="#475569"/>
    <text x="221" y="776" text-anchor="middle" font-size="13" font-weight="800" fill="#E2E8F0">Set Startup</text>
    <rect x="294" y="748" width="64" height="44" rx="14" fill="url(#accent)" filter="url(#violetGlow)"/>
    <text x="326" y="776" text-anchor="middle" font-size="13" font-weight="900" fill="#020617">Save</text>

    <rect x="30" y="830" width="370" height="58" rx="18" fill="#0B1220" stroke="#334155" stroke-opacity="0.85"/>
    <text x="50" y="854" font-size="12" font-weight="800" fill="#CBD5E1">Wi-Fi Session</text>
    <text x="50" y="874" font-size="11" fill="#64748B">RobotArmPro-Setup · Phone 192.168.4.2</text>
    <circle cx="360" cy="859" r="8" fill="#22C55E" filter="url(#cyanGlow)"/>
