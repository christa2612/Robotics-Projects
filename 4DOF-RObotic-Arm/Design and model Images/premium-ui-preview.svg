      <text x="76" y="331" text-anchor="middle" font-size="16" font-weight="850" fill="#67E8F9">90°</text>
      <text x="154" y="331" text-anchor="middle" font-size="16" font-weight="850" fill="#67E8F9">92°</text>
      <text x="232" y="331" text-anchor="middle" font-size="16" font-weight="850" fill="#67E8F9">86°</text>
      <text x="310" y="331" text-anchor="middle" font-size="16" font-weight="850" fill="#67E8F9">42°</text>

      <text x="76" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">180</text>
      <text x="154" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">180</text>
      <text x="232" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">180</text>
      <text x="310" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">180</text>

      <rect x="68" y="374" width="16" height="214" rx="8" fill="url(#rail)" filter="url(#cyanGlow)"/>
      <rect x="146" y="374" width="16" height="214" rx="8" fill="url(#rail)"/>
      <rect x="224" y="374" width="16" height="214" rx="8" fill="url(#rail)"/>
      <rect x="302" y="374" width="16" height="214" rx="8" fill="url(#rail)"/>

      <rect x="54" y="452" width="44" height="80" rx="15" fill="url(#thumb)" stroke="#F8FAFC" stroke-opacity="0.18"/>
      <rect x="132" y="446" width="44" height="80" rx="15" fill="url(#thumb)" stroke="#F8FAFC" stroke-opacity="0.18"/>
      <rect x="210" y="460" width="44" height="80" rx="15" fill="url(#thumb)" stroke="#F8FAFC" stroke-opacity="0.18"/>
      <rect x="288" y="525" width="44" height="80" rx="15" fill="url(#thumb)" stroke="#F8FAFC" stroke-opacity="0.18"/>

      <text x="76" y="612" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">0</text>
      <text x="154" y="612" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">0</text>
      <text x="232" y="612" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">0</text>
      <text x="310" y="612" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">0</text>

      <text x="76" y="641" text-anchor="middle" font-size="13" font-weight="850" fill="#F8FAFC">Base</text>
      <text x="154" y="641" text-anchor="middle" font-size="13" font-weight="850" fill="#F8FAFC">Shoulder</text>
      <text x="232" y="641" text-anchor="middle" font-size="13" font-weight="850" fill="#F8FAFC">Elbow</text>
      <text x="310" y="641" text-anchor="middle" font-size="13" font-weight="850" fill="#F8FAFC">Clamp</text>
