    <text x="50" y="188" font-size="12" fill="#94A3B8">Live control speed</text>
    <rect x="172" y="154" width="78" height="38" rx="14" fill="#0B1220" stroke="#334155"/>
    <text x="211" y="178" text-anchor="middle" font-size="13" font-weight="800" fill="#CBD5E1">Slow</text>
    <rect x="256" y="154" width="78" height="38" rx="14" fill="url(#accent)" filter="url(#cyanGlow)"/>
    <text x="295" y="178" text-anchor="middle" font-size="13" font-weight="900" fill="#020617">Medium</text>
    <rect x="340" y="154" width="48" height="38" rx="14" fill="#0B1220" stroke="#334155"/>
    <text x="364" y="178" text-anchor="middle" font-size="13" font-weight="800" fill="#CBD5E1">Fast</text>

