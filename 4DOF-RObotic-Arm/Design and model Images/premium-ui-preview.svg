    <text x="50" y="294" font-size="12" fill="#94A3B8">Drag faders. The arm follows live.</text>
    <rect x="300" y="256" width="64" height="30" rx="15" fill="#082F49" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="332" y="275" text-anchor="middle" font-size="12" font-weight="800" fill="#7DD3FC">LIVE</text>

